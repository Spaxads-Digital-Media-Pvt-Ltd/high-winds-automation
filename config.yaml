# ============================================================
#  Lead Automation — Master Configuration
# ============================================================

# --- Target Form ---
target:
  url: "https://www.americanemergencyfund.com/"  # Target URL

  # Native Bootstrap wizard on the landing page (no iframe).  The step order is
  # decided server-side per session, so core/form_filler_aef.py dispatches on the
  # field names currently rendered rather than on a fixed step index.

  # Timeout (seconds) to wait for navigation
  page_timeout: 60

# --- Form behaviour ---
form:
  max_steps: 40                 # safety cap on wizard iterations per lead

# --- Retry & Backoff ---
retry:
  max_retries: 1                # Retries per row after the first attempt (1 initial + 1 retry = 2 total)
  backoff_base: 2               # Exponential backoff base (seconds)
  backoff_max: 30               # Cap on backoff delay

# --- Smart Lead Pacing (paced scheduler mode) ---
pacing:
  processing:
    avg_success_time_min: 1.5   # avg minutes for a successful lead
    avg_retry_time_min: 3.0     # avg minutes for a lead that needs a retry
    assumed_success_rate: 0.80  # fraction expected to succeed first try
  peak_hours:                   # reduced volume during these windows (proxy stability)
    - start: "07:00"
      end: "09:00"
      multiplier: 0.65
    - start: "18:00"
      end: "22:00"
      multiplier: 0.60
  off_peak_multiplier: 1.0
  offer_stagger_minutes: 12     # offset each offer's releases within an hour
  catch_up_threshold: 0.30      # >30% behind triggers a catch-up warning
  timezone: "America/New_York"

# --- Delays (seconds) — human-like pacing ---
delays:
  min_typing_delay: 0.06        # Min delay between keystrokes
  max_typing_delay: 0.15        # Max delay between keystrokes
  min_action_delay: 0.5         # Min pause between form actions
  max_action_delay: 1.8         # Max pause between form actions
  page_load_wait: 3             # Extra wait after page load
  pre_submit_wait: 1.5          # Pause before clicking submit
  # Human pacing for the browser fillers (AEF / MyLendingWallet):
  read_pause:  [0.5, 1.2]       # beat after a step renders — "reading the question"
  field_pause: [0.35, 0.8]      # beat between fields within a multi-field step

# --- Device Emulation Defaults ---
# These apply when Use_Custom_Device != "yes" in the sheet
device_defaults:
  random_viewport: true
  random_locale: true
  random_timezone: true
  random_color_scheme: true
  viewport_width_range: [360, 430]
  viewport_height_range: [640, 932]
  device_scale_factor_range: [2.0, 3.5]

# --- Screenshots ---
screenshots:
  on_failure: true
  on_success: false
  directory: "screenshots"

# --- Logging ---
logging:
  level: "INFO"                 # DEBUG | INFO | WARNING | ERROR
  log_file: "logs/automation.log"
  console: true
  json_logs: false              # Set true for machine-parseable JSON lines

# --- Google Sheet Column Mapping ---
# Map internal field names → actual column headers in your sheet.
# Change the VALUES here to match your sheet's column names exactly.
sheet_columns:
  status: "Status"
  notes: "Notes"
  proxy_used: "Proxy_Used"
  ip: "IP"
  last_attempt: "Last_Attempt"
  retry_count: "Retry_Count"
  submission_id: "Submission_ID"
  device_model: "Device_Model"
  android_version: "Android_Version"
  orientation: "Orientation"
  use_custom_device: "Use_Custom_Device"
