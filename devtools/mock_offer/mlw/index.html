<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MLW mock</title></head>
<body>
<div id="root">
  <!-- No consent gate: the live site renders step 0 immediately, with
       "Start Request Now" acting as that step's advance button. -->
  <div id="stepHost">
    <form id="tf---placeholder" class="contents"></form>
    <div id="nav"><button type="button" id="advance">Start Request Now</button></div>
  </div>
</div>
<script>
/* Reproduces mylendingwallet.com's OBSERVED DOM contract, not its content:
     - the <form> id is regenerated on every render
     - choices are <button> elements carrying the visible label, not radios
     - inputs carry the platform `name` attributes
     - a separate advance button ("Start Request Now" on step 0, then "Continue")
   The option LABELS below are the ones the filler assumes (inherited from AEF's
   vocabulary). That makes this a test of the filler's mechanics — button
   clicking, dynamic-form-id detection, react-style value writes — and NOT proof
   that the real site uses these labels. Only a live walk can establish that. */
const TEN = [['60','5 years or more'],['48','4 years'],['36','3 years'],
             ['24','2 years'],['12','1 year or less']];
const STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA',
 'KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND',
 'OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

const txt = (n, ph) => `<input type="text" name="${n}" placeholder="${ph||n}">`;
const btns = pairs => pairs.map(([v,l]) =>
  `<button type="button" data-field-value="${v}">${l}</button>`).join('');
const sel  = (n, opts) => `<select name="${n}"><option value="">Select</option>` +
  opts.map(([v,l]) => `<option value="${v}">${l}</option>`).join('') + `</select>`;

const steps = [
  {f:['loanreqamt'], html: `<h2>Loan amount</h2>` + txt('loanreqamt','5,000') +
     btns([['1000','up to $1,000'],['3000','up to $3,000'],['5000','above + $3,000']])},
  {f:['fname','lname','dob'], html: `<h2>Your legal name</h2>` + txt('fname','First name')+txt('lname','Last name')+txt('dob','01/01/1970')},
  {f:['email','lastfourssn'], html: `<h2>Email address</h2>` + txt('email','your@email.com')+txt('lastfourssn','****')},
  {f:['phhm'], html: `<h2>Your phone number</h2>` + txt('phhm','(555) 555-5555')},
  {f:['hpostal','haddress1','hcity','hstate'], html: `<h2>Home address</h2>` + txt('hpostal','Zip')+txt('haddress1','Address')+txt('hcity','City')+
         sel('hstate', STATES.map(s=>[s,s]))},
  // exercised as a BUTTON list (the SPA renders some pickers this way)
  {f:['i_ad_ccDebtAmt'], choiceOnly:true, html: `<h2>How much credit card debt do you have?</h2>` + btns([['0','none'],['4999','$1,000 - $4,999'],
     ['9999','$5,000 - $9,999'],['14999','$10,000 - $14,999'],['19999','$15,000 - $19,999'],
     ['24999','$20,000 - $24,999'],['29999','$25,000 - $29,999'],['34999','$30,000 - $34,999'],
     ['39999','$35,000 - $39,999'],['44999','$40,000 - $44,999'],['49999','$45,000 - $49,999'],
     ['50000','$50,000 +']])},
  {f:['hmonthsat'], choiceOnly:true, html: `<h2>How long at this address?</h2>` + btns(TEN)},
  {f:['ishowner'], choiceOnly:true, html: `<h2>Do you own your home?</h2>` + btns([['1','Yes'],['0','No']])},
  {f:['netim'], choiceOnly:true, html: `<h2>What is your net monthly income?</h2>` + btns([['11000','$10,000 or More'],['10000','$9,000 - $10,000'],
     ['9000','$8,000 - $9,000'],['8000','$7,000 - $8,000'],['7000','$6,000 - $7,000'],
     ['6000','$5,000 - $6,000'],['5000','$4,000 - $5,000'],['4000','$3,000 - $4,000'],
     ['3000','$2,500 - $3,000'],['2500','$2,000 - $2,500'],['2000','$1,500 - $2,000'],
     ['1500','Below $1500']])},
  {f:['priincsrc'], choiceOnly:true, html: `<h2>What is your primary income source?</h2>` + btns([['1','Employed or self employed'],['2','Benefits or not employed']])},
  {f:['payfreq'], choiceOnly:true, html: `<h2>How often are you paid?</h2>` + btns([['1','Weekly'],['2','Bi-Weekly'],['3','Monthly'],['4','Semi-Monthly']])},
  {f:['isactmil'], choiceOnly:true, html: `<h2>Are you active military?</h2>` + btns([['1','Yes'],['0','No']])},
  {f:['ename'], html: `<h2>Employer name</h2>` + txt('ename','Employer Name')},
  {f:['emonthsat'], choiceOnly:true, html: `<h2>How long with this employer?</h2>` + btns(TEN)},
  {f:['phwrk'], html: `<h2>Work phone</h2>` + txt('phwrk','Work number')},
  {f:['licn','licst'], html: `<h2>Driver license</h2>` + txt('licn','License number')+sel('licst', STATES.map(s=>[s,s]))},
  {f:['ssn'], html: `<h2>Social security number</h2>` + txt('ssn','SSN')},
  {f:['bacctype'], choiceOnly:true, html: `<h2>Account type</h2>` + btns([['1','Checking'],['2','Savings']])},
  {f:['bmonthsat'], choiceOnly:true, html: `<h2>How long with your bank account?</h2>` + btns(TEN)},
  {f:['isdd'], choiceOnly:true, html: `<h2>Is your paycheck direct deposited?</h2>` + btns([['1','Yes'],['0','No']])},
  {f:['crscore'], choiceOnly:true, html: `<h2>What is your credit score?</h2>` + btns([['2','Great 700+'],['3','600 - 700'],
     ['4','500 - 600'],['5','Below 500'],['1','Not Sure']])},
  {f:['loanreason'], choiceOnly:true, html: `<h2>What is the reason for your loan?</h2>` + btns([['14','Credit card debt relief'],
     ['1','Debt consolidation'],['13','Other reasons']])},
  {f:['baba','bacc'], html: `<h2>Your bank details</h2>` + txt('baba','Bank routing number')+txt('bacc','Bank account number')},
];

let cur = -1, captured = {};
const host = document.getElementById('stepHost');
const advance = document.getElementById('advance');
let form = document.getElementById('tf---placeholder');

function render(i) {
  cur = i;
  // regenerate the form id every render, exactly as the real SPA does
  const fresh = document.createElement('form');
  fresh.id = 'tf---' + Math.random().toString(36).slice(2, 9);
  fresh.className = 'contents';
  fresh.innerHTML = steps[i].html;
  form.replaceWith(fresh);
  form = fresh;
  form.querySelectorAll('button[data-field-value]').forEach(b => {
    b.addEventListener('click', () => {
      captured[steps[cur].f[0]] = b.dataset.fieldValue;
      b.setAttribute('aria-pressed', 'true');
    });
  });
  advance.innerText = (i === steps.length - 1) ? 'Request Loan'
                     : (i === 0 ? 'Start Request Now' : 'Continue');
}

function capture() {
  form.querySelectorAll('input[name],select[name]').forEach(el => {
    if (el.value) captured[el.name] = el.value.replace(/,/g, '');
  });
}

render(0);   // step 0 is on screen from the start, as on the live site

advance.addEventListener('click', () => {
  capture();
  const missing = steps[cur].f.filter(n => !(n in captured));
  if (missing.length) { window.__mockError = 'missing ' + missing.join(','); return; }
  if (cur === steps.length - 1) {
    sessionStorage.setItem('captured', JSON.stringify(captured));
    location.href = 'result.html?cmd=RenderResult&uuid=MOCKMLW';
    return;
  }
  render(cur + 1);
});
</script>
</body></html>
